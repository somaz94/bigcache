name: build
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Test on 386
        run: GOARCH=386 go test -count=1 . ./queue

      - name: Test on arm
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user
          GOARCH=arm go test -exec qemu-arm -count=1 . ./queue
